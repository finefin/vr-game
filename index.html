<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rhythm Slicer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #overlay {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.88); color: #fff; text-align: center;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { margin: 0 0 8px; font-size: 2rem; }
    #overlay p { margin: 4px 0; opacity: 0.8; }
    #start { margin-top: 20px; font-size: 1.1rem; padding: 10px 28px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Rhythm Slicer</h1>
    <p id="sub">Slice the cubes on the beat with the matching colored saber.<br>Perfect &le; 50ms &middot; Good &le; 100ms &middot; OK &le; 150ms.</p>
    <p>Enter VR, then press a controller trigger to start.</p>
    <button id="start">Start</button>
  </div>

  <a-scene renderer="antialias:false">
    <a-sky color="#0a0a12"></a-sky>

    <a-entity id="rig">
      <a-camera id="cam" position="0 1.6 0"></a-camera>

      <a-entity hand-controls="hand: left" position="-0.3 1.3 -0.4">
        <a-box id="blade-left" slicer="color: red" position="0 0 -0.45"
               width="0.03" height="0.03" depth="0.9"
               material="shader: flat; color: #ff3355"></a-box>
      </a-entity>

      <a-entity hand-controls="hand: right" position="0.3 1.3 -0.4">
        <a-box id="blade-right" slicer="color: blue" position="0 0 -0.45"
               width="0.03" height="0.03" depth="0.9"
               material="shader: flat; color: #33ccff"></a-box>
      </a-entity>

      <a-entity id="hud" position="0 1.45 -2">
        <a-text id="score" value="" align="center" position="0 0.15 0"
                color="#ffffff" scale="1.2 1.2 1"></a-text>
        <a-text id="combo" value="" align="center" position="0 -0.1 0"
                color="#ffdd55" scale="0.8 0.8 1"></a-text>
      </a-entity>
    </a-entity>

    <a-entity id="notes"></a-entity>
  </a-scene>

  <script src="audio.js"></script>
  <script src="components/note.js"></script>
  <script src="components/slicer.js"></script>
  <script src="components/game.js"></script>
  <script>
    document.getElementById('start').addEventListener('click', function () {
      window.Game.start();
    });
  </script>
</body>
</html>
